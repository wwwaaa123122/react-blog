name = "starlr-blog"
main = "src/worker.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录（构建产物）
assets = { directory = "dist", binding = "ASSETS" }

# 路由
routes = [
  { pattern = "xc-lr.cn/*", zone_id = "YOUR_ZONE_ID" }
]

# 环境变量
[vars]
SITE_URL = "https://xc-lr.cn"

# 构建配置
[build]
command = "pnpm build"
cwd = ""

[build.upload]
format = "service-worker"
