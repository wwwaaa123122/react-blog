# Pages CMS 配置文件
# 文档: https://pagescms.org/docs/
#
# 使用方法：打开 https://app.pagescms.org ，用 GitHub 登录，
# 安装 GitHub App 后选择本仓库即可在线编辑文章与图片。

# ============ 媒体（图片）存储 ============
media:
  - name: images
    label: 文章图片
    input: public/images
    output: /images
    rename: safe
    categories: [image]
    commit:
      templates:
        create: "图片: 添加 {filename}"
        update: "图片: 更新 {filename}"
        delete: "图片: 删除 {filename}"

# ============ 可编辑内容 ============
content:
  # 博客文章
  - name: posts
    label: 博客文章
    type: collection
    path: src/posts
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, published, category, draft]
      sort: [published, title]
      search: [title, description, body]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: 更新日期
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        label: 草稿
        type: boolean
        description: 草稿不会出现在正式构建中
      - name: description
        label: 描述
        type: text
      - name: image
        label: 封面图
        type: image
        options:
          media: images
      - name: tags
        label: 标签
        type: string
        list: true
      - name: category
        label: 分类
        type: string
        description: 例如 tech、daily
      - name: lang
        label: 文章语言
        type: select
        options:
          values: [zh_CN, zh_TW, en, ja, ru]
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          media: images

  # 个人资料（首页）
  - name: profile
    label: 个人资料
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - name: avatar
        label: 头像
        type: string
      - name: name
        label: 名字
        type: string
      - name: bio
        label: 签名
        type: text
      - name: links
        label: 社交链接
        type: object
        list: true
        fields:
          - name: name
            label: 名称
            type: string
          - name: url
            label: 链接
            type: string
          - name: icon
            label: 图标
            type: select
            options:
              values: [github, x, telegram, bilibili, mail]

  # 友链
  - name: friends
    label: 友链
    type: file
    path: src/data/friends.json
    format: json
    fields:
      - name: list
        label: 友链列表
        type: object
        list: true
        fields:
          - name: title
            label: 名称
            type: string
          - name: imgurl
            label: 头像
            type: string
          - name: desc
            label: 描述
            type: text
          - name: siteurl
            label: 网址
            type: string
          - name: tags
            label: 标签
            type: string
            list: true
          - name: weight
            label: 权重
            type: number
          - name: enabled
            label: 启用
            type: boolean
      - name: siteInfo
        label: 本站信息
        type: object
        fields:
          - name: name
            label: 站点名称
            type: string
          - name: desc
            label: 站点描述
            type: text
          - name: url
            label: 站点链接
            type: string
          - name: avatar
            label: 头像链接
            type: string
          - name: email
            label: 申请邮箱
            type: string
      - name: notes
        label: 注意事项
        type: object
        list: true
        fields:
          - name: title
            label: 标题
            type: string
          - name: content
            label: 内容
            type: text
      - name: template
        label: 申请模板
        type: text

  # 站点配置
  - name: site
    label: 站点配置
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: title
        label: 站点标题
        type: string
      - name: subtitle
        label: 副标题
        type: string
      - name: author
        label: 作者
        type: string
      - name: site_url
        label: 站点地址
        type: string
      - name: description
        label: 站点描述
        type: text
      - name: keywords
        label: 关键词
        type: string
        list: true
      - name: since
        label: 建站年份
        type: number

# ============ 全局设置 ============
settings:
  content:
    merge: true
  commit:
    templates:
      create: "内容: 创建 {path}"
      update: "内容: 更新 {path}"
      delete: "内容: 删除 {path}"
      rename: "内容: 重命名 {oldPath} -> {newPath}"
