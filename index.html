<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 首屏前同步应用主题，避免刷新时先亮色再暗色的闪烁 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="星辰旅人 - 分享技术、生活与热爱的个人博客" />
    <link rel="alternate" type="text/markdown" href="%BASE_URL%llms.txt" title="llms.txt" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="%BASE_URL%rss.xml" />
    <title>Starlr Blog · 星辰旅人</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
