name: FTP Deploy

# 推送（含 Pages CMS 保存后的自动提交）到 main/master 时构建并上传到 FTP 服务器
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只保留一个运行中的上传任务，避免并发冲突
concurrency:
  group: ftp-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 站点的 vite base 默认是 "/"，直接以根目录方式构建上传；
      # 若 FTP 站点部署在子路径，可在此加 env: VITE_BASE: /子路径/
      - name: Build site
        run: pnpm build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # 远程目录：默认 FTP 登录后的根目录；如服务器 web 根目录不是登录目录，
          # 可在仓库 Settings -> Variables 里添加 FTP_REMOTE_DIR（如 /public_html）
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '.' }}
        timeout-minutes: 15
        run: |
          lftp --env-password -u "$FTP_USERNAME" -p "$FTP_PORT" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 2
          set ftp:passive-mode on
          mirror --reverse --delete --only-newer --no-perms --parallel=4 --verbose "dist/" "$FTP_REMOTE_DIR"
          quit
          EOF
