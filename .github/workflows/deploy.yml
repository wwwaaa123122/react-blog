name: Build and Deploy

on:
  # 推送（包括 Pages CMS 保存后的自动提交）时触发构建部署
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # 生产 CI 必须与 lockfile 完全一致，禁止重新解析依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build site
        run: pnpm build
        env:
          VITE_BASE: /react-blog/ # GitHub Pages 子路径部署

      # 全站冒烟测试：起 preview 服务逐页验证（h1/canonical/死链/console 错误等）
      - name: Smoke test
        run: |
          pnpm exec playwright install --with-deps chromium
          # preview 服务器读取 vite.config.ts 的 base（VITE_BASE），必须显式导出，
          # 否则静态资源会命中 SPA fallback 返回 text/html 导致浏览器 404
          export VITE_BASE=/react-blog/
          pnpm preview --port 4173 --strictPort & echo $! > /tmp/preview.pid
          npx --yes wait-on http://localhost:4173/react-blog/ --timeout 30000
          pnpm smoke-test http://localhost:4173/react-blog/
          kill $(cat /tmp/preview.pid)

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages # 部署到 pages 分支
          folder: dist
          clean: true
